---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: google
  namespace: flux-system
spec:
  providerRef:
    name: google
  eventMetadata:
    env: local-test
    cluster: minikube
    region: mg
  eventSeverity: info
  eventSources:
    - kind: GitRepository
      name: '*'
    - kind: Kustomization
      name: '*'
    - kind: HelmRelease
      name: '*'
